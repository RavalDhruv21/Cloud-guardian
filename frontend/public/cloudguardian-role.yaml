AWSTemplateFormatVersion: '2010-09-09'
Description: Cloud Guardian Monitor Role — full access for infrastructure monitoring and auto-remediation

Resources:

  # ── S3 Bucket for CloudTrail logs ─────────────────────────
  CloudGuardianTrailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'cloud-guardian-trail-${AWS::AccountId}'
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldLogs
            Status: Enabled
            ExpirationInDays: 90

  # ── S3 Bucket Policy for CloudTrail ───────────────────────
  CloudGuardianTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudGuardianTrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt CloudGuardianTrailBucket.Arn
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${CloudGuardianTrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

  # ── CloudTrail (multi-region so all API calls are captured) ──
  CloudGuardianTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: CloudGuardianTrailBucketPolicy
    Properties:
      TrailName: cloud-guardian-trail
      S3BucketName: !Ref CloudGuardianTrailBucket
      IsLogging: true
      IncludeGlobalServiceEvents: true
      IsMultiRegionTrail: true
      EnableLogFileValidation: true

  # ── IAM Role ───────────────────────────────────────────────
  CloudGuardianMonitorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudGuardianMonitorRoles
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::808715035605:root'
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudGuardianFullAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # CloudWatch — read metrics
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                  - cloudwatch:GetMetricData
                Resource: '*'
              # EC2 — read + remediation actions
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeVolumes
                  - ec2:DescribeAddresses
                  - ec2:DescribeSecurityGroups
                  - ec2:StopInstances
                  - ec2:StartInstances
                  - ec2:ModifyInstanceAttribute
                  - ec2:DeleteVolume
                  - ec2:ReleaseAddress
                  - ec2:RevokeSecurityGroupIngress
                Resource: '*'
              # RDS — read + stop/start
              - Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                  - rds:StopDBInstance
                  - rds:StartDBInstance
                Resource: '*'
              # S3 — read + public access block
              - Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                  - s3:ListBucket
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketAcl
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                Resource: '*'
              # CloudTrail — read audit logs
              - Effect: Allow
                Action:
                  - cloudtrail:LookupEvents
                  - cloudtrail:GetTrailStatus
                  - cloudtrail:DescribeTrails
                Resource: '*'
              # Cost Explorer
              - Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                  - ce:GetCostForecast
                Resource: '*'
              # Lambda — list only
              - Effect: Allow
                Action:
                  - lambda:ListFunctions
                Resource: '*'
              # STS — required for role validation
              - Effect: Allow
                Action:
                  - sts:AssumeRole
                  - sts:GetCallerIdentity
                Resource: '*'

  # ── EventBridge rule: S3 public access events ──────────────
  # Forwards to Cloud Guardian remediation Lambda in real-time
  S3SecurityEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: cloud-guardian-s3-security-forward
      Description: Forward S3 public access events to Cloud Guardian remediation Lambda
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - CreateBucket
            - PutBucketAcl
            - PutBucketPolicy
            - DeletePublicAccessBlock
            - PutBucketPublicAccessBlock
      State: ENABLED
      Targets:
        - Id: CloudGuardianRemediationLambda
          Arn: arn:aws:lambda:us-east-1:808715035605:function:cloud-guardian-remediation

  # ── EventBridge rule: Security Group port 22 ───────────────
  SGSecurityEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: cloud-guardian-sg-security-forward
      Description: Forward SG port 22 open events to Cloud Guardian remediation Lambda
      EventPattern:
        source:
          - aws.ec2
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - AuthorizeSecurityGroupIngress
      State: ENABLED
      Targets:
        - Id: CloudGuardianRemediationLambdaSG
          Arn: arn:aws:lambda:us-east-1:808715035605:function:cloud-guardian-remediation

  # ── EventBridge rule: Root account login ───────────────────
  RootLoginEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: cloud-guardian-root-login-forward
      Description: Forward root account login events to Cloud Guardian remediation Lambda
      EventPattern:
        source:
          - aws.signin
        detail-type:
          - AWS Console Sign In via CloudTrail
        detail:
          userIdentity:
            type:
              - Root
      State: ENABLED
      Targets:
        - Id: CloudGuardianRemediationLambdaRoot
          Arn: arn:aws:lambda:us-east-1:808715035605:function:cloud-guardian-remediation

Outputs:
  RoleArn:
    Description: Copy this ARN and paste it into Cloud Guardian
    Value: !GetAtt CloudGuardianMonitorRole.Arn
  TrailArn:
    Description: CloudTrail ARN created for audit logging
    Value: !GetAtt CloudGuardianTrail.Arn
  AccountId:
    Description: Your AWS Account ID
    Value: !Ref AWS::AccountId