name: Deploy Cloud Guardian

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install boto3 requests python-dotenv

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build and deploy Lambdas
        run: |
          mkdir -p build

          deploy_lambda() {
            NAME=$1
            FUNCTION=$2
            echo "Building $NAME..."
            cd lambdas/$NAME
            pip install -r requirements.txt -t . 2>/dev/null || true
            zip -r ../../build/${NAME}.zip . -x "*.pyc" -x "__pycache__/*"
            cd ../..
            echo "Deploying $FUNCTION..."
            aws lambda update-function-code \
              --function-name $FUNCTION \
              --zip-file fileb://build/${NAME}.zip \
              --region us-east-1
          }

          deploy_lambda collector cloud-guardian-collector
          deploy_lambda ai_analyzer cloud-guardian-ai-analyzer
          deploy_lambda cost_optimizer cloud-guardian-cost-optimizer
          deploy_lambda remediation cloud-guardian-remediation
          deploy_lambda report_generator cloud-guardian-report-generator
          deploy_lambda api cloud-guardian-api
          deploy_lambda analytics_export cloud-guardian-analytics-export

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        env:
          NEXT_PUBLIC_APP_URL: https://d1nybctg2u5m4a.cloudfront.net/auth/callback
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: us-east-1_yqv39lzIR
          NEXT_PUBLIC_COGNITO_CLIENT_ID: 5g0e3aalsqv9c9e76i0oi6b6mk
          NEXT_PUBLIC_COGNITO_DOMAIN: us-east-1yqv39lzir.auth.us-east-1.amazoncognito.com
          NEXT_PUBLIC_REGION: us-east-1
          NEXT_PUBLIC_API_URL: https://06d5dalth2.execute-api.us-east-1.amazonaws.com/prod
          NEXT_PUBLIC_AWS_ACCOUNT_ID: "808715035605"
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy Frontend to S3
        run: |
          aws s3 sync frontend/out s3://cloud-guardian-4626 --exclude "*" --include "_next/static/*" --cache-control "public, max-age=31536000, immutable" --delete --region us-east-1
          aws s3 sync frontend/out s3://cloud-guardian-4626 --exclude "_next/static/*" --cache-control "public, max-age=0, must-revalidate" --delete --region us-east-1

      - name: Apply S3 Bucket Policy
        run: |
          aws s3api put-public-access-block --bucket cloud-guardian-4626 --region us-east-1 --public-access-block-configuration BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false
          aws s3api put-bucket-policy --bucket cloud-guardian-4626 --region us-east-1 --policy '{"Version":"2012-10-17","Statement":[{"Sid":"PublicRead","Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::cloud-guardian-4626/*"}]}'

      - name: Update CloudFront Function
        run: |
          ETAG=$(aws cloudfront describe-function --name cloud-guardian-rewrite --query "ETag" --output text)
          NEW_ETAG=$(aws cloudfront update-function --name cloud-guardian-rewrite --function-config Comment="URL rewrite for Next.js static export",Runtime="cloudfront-js-2.0" --function-code fileb://cf-function.js --if-match $ETAG --query "ETag" --output text)
          aws cloudfront publish-function --name cloud-guardian-rewrite --if-match $NEW_ETAG

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id $(aws cloudfront list-distributions --query "DistributionList.Items[0].Id" --output text) --paths "/*.html" "/"

# ==========================================
# MANUAL CLOUDFRONT 404 CONFIGURATION NOTE
# ==========================================
# To properly handle 404s for this statically exported Next.js app, 
# a one-time manual configuration is required in the AWS Console:
# 1. Go to CloudFront -> Select your Distribution -> "Error pages" tab.
# 2. Click "Create custom error response".
# 3. HTTP error code: 403 (Forbidden)  ->  Response page path: /404.html  -> HTTP Response Code: 404
# 4. HTTP error code: 404 (Not Found)  ->  Response page path: /404.html  -> HTTP Response Code: 404
#
# (S3 returns a 403 when a file doesn't exist and ListBucket permissions are denied, 
#  which is standard practice for secure static site hosting.)
# ==========================================

      - name: Done
        run: echo "All Lambdas and Frontend deployed successfully!"